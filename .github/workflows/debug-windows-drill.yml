name: Debug Windows Drill

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -e .
      - name: Run doctor
        run: python -m deepseek_runtime.cli doctor --json; echo "DOCTOR_EXIT=$LASTEXITCODE"
      - name: Run observability drill
        run: python scripts/release_observability_drill.py; echo "OBS_EXIT=$LASTEXITCODE"
      - name: Run safety drill
        run: python scripts/release_safety_drill.py; echo "SAFETY_EXIT=$LASTEXITCODE"
      - name: Run release drill
        run: python scripts/release_drill.py --skip-tests --out debug-drill.json; echo "DRILL_EXIT=$LASTEXITCODE"
      - name: Show drill output
        run: Get-Content debug-drill.json | Select-Object -Last 40
