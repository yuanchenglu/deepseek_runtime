name: Agent M2-D Approval Matrix Patch

on:
  push:
    branches:
      - agent/m2-runtime-lifecycle
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent-m2d-approval-matrix-patch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m2-runtime-lifecycle
          fetch-depth: 0

      - name: Patch Runtime and regression tests
        shell: python
        run: |
          from pathlib import Path

          runtime = Path("src/deepseek_runtime/runtime.py")
          text = runtime.read_text(encoding="utf-8")
          old = '''                    if checkpoint_call is not None and new_authorization_events:
                        checkpoint_call.approval = new_authorization_events[-1].to_dict()

                    execution_events = step_evidence["execution_events"]
'''
          new = '''                    if checkpoint_call is not None and new_authorization_events:
                        checkpoint_call.approval = new_authorization_events[-1].to_dict()
                        if outcome.error is not None and outcome.execution_event is None:
                            handoff_current_state(step)

                    execution_events = step_evidence["execution_events"]
'''
          if old not in text:
              if new not in text:
                  raise SystemExit("Runtime approval-result handoff anchor not found")
          else:
              runtime.write_text(text.replace(old, new, 1), encoding="utf-8")

          tests = Path("tests/test_runtime_lifecycle_review.py")
          text = tests.read_text(encoding="utf-8")
          anchor = '''    def test_equal_token_limit_stops_at_threshold(self) -> None:
'''
          addition = '''    def test_cached_session_approval_is_checkpointed_before_later_execution(self) -> None:
        class Approver:
            def request_approval(self, request: Any) -> ApprovalOutcome:
                return ApprovalOutcome.APPROVE_SESSION

        checkpoints: list[Any] = []
        result = self.run_runtime(
            Client([tool_message(call("call-1"), call("call-2")), final_message()]),
            tools=ToolRegistry((write_spec(),)),
            policy=PermissionPolicy((PermissionRule(Risk.WRITE, Decision.ASK),)),
            approval_provider=Approver(),
            execution_adapter=FakeExecutionAdapter(("one", "two")),
            checkpoint_sink=checkpoints.append,
        )

        self.assertTrue(result.ok)
        cached = next(
            checkpoint
            for checkpoint in checkpoints
            if len(checkpoint.approvals) == 2
            and checkpoint.approvals[-1]["approval_outcome"] == "approve-session"
            and checkpoint.approvals[-1]["cached_session_approval"]
        )
        self.assertIs(cached.runtime_state, RuntimeState.TOOL_RUNNING)
        self.assertEqual(cached.tool_calls[-1].state, RuntimeState.TOOL_RUNNING)

    def test_resolved_non_execution_approval_outcomes_are_checkpointed(self) -> None:
        class StaticApprover:
            def __init__(self, outcome: ApprovalOutcome) -> None:
                self.outcome = outcome

            def request_approval(self, request: Any) -> ApprovalOutcome:
                return self.outcome

        class RaisingApprover:
            def request_approval(self, request: Any) -> ApprovalOutcome:
                raise RuntimeError("private approval failure")

        class InvalidApprover:
            def request_approval(self, request: Any) -> Any:
                return "approve-once"

        cases = (
            ("deny", StaticApprover(ApprovalOutcome.DENY), "deny"),
            ("timeout", StaticApprover(ApprovalOutcome.TIMEOUT), "timeout"),
            ("missing", None, "unavailable"),
            ("provider-error", RaisingApprover(), "unavailable"),
            ("invalid", InvalidApprover(), "invalid"),
        )
        for name, provider, expected_outcome in cases:
            with self.subTest(name=name):
                checkpoints: list[Any] = []
                result = self.run_runtime(
                    Client([tool_message(call("call-1")), final_message()]),
                    tools=ToolRegistry((write_spec(),)),
                    policy=PermissionPolicy((PermissionRule(Risk.WRITE, Decision.ASK),)),
                    approval_provider=provider,
                    execution_adapter=FakeExecutionAdapter(()),
                    checkpoint_sink=checkpoints.append,
                )

                self.assertTrue(result.ok)
                resolved = next(
                    checkpoint
                    for checkpoint in checkpoints
                    if checkpoint.approvals
                    and checkpoint.approvals[-1]["approval_outcome"] == expected_outcome
                )
                self.assertEqual(
                    resolved.tool_calls[-1].approval["approval_outcome"],
                    expected_outcome,
                )
                self.assertIsNot(resolved.tool_calls[-1].state, RuntimeState.TOOL_RUNNING)

'''
          if addition not in text:
              if anchor not in text:
                  raise SystemExit("Review-test insertion anchor not found")
              tests.write_text(text.replace(anchor, addition + anchor, 1), encoding="utf-8")

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- src/deepseek_runtime/runtime.py tests/test_runtime_lifecycle_review.py; then
            echo "No patch commit required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/deepseek_runtime/runtime.py tests/test_runtime_lifecycle_review.py
          git commit -m "test(runtime): cover resolved approval checkpoint matrix"
          git push origin HEAD:agent/m2-runtime-lifecycle
