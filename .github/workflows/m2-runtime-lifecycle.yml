name: M2 Runtime Lifecycle Gate

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: m2-runtime-lifecycle-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  workspace-patch:
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m2-e-workspace-p1
          fetch-depth: 0
      - name: Attach bounded Workspace contracts to production tools
        shell: python
        run: |
          from pathlib import Path

          runtime = Path("src/deepseek_runtime/runtime.py")
          text = runtime.read_text(encoding="utf-8")
          text = text.replace(
              "from .workspace import WorkspaceResolver, WorkspaceViolation",
              "from .workspace import WorkspaceResolver, WorkspaceSearchBudgets, WorkspaceViolation",
              1,
          )
          marker = "@dataclass\nclass WorkspaceTools:"
          start = text.find(marker)
          if start < 0:
              raise SystemExit("WorkspaceTools marker not found")
          replacement = '''@dataclass
          class WorkspaceTools:
              """Built-in bounded read-only tools behind the single WorkspaceResolver."""

              root: str | Path
              read_max_bytes: int = 20_000
              search_budgets: WorkspaceSearchBudgets = field(
                  default_factory=WorkspaceSearchBudgets
              )
              _resolver: WorkspaceResolver = field(init=False, repr=False)

              def __post_init__(self) -> None:
                  if (
                      not isinstance(self.read_max_bytes, int)
                      or isinstance(self.read_max_bytes, bool)
                      or self.read_max_bytes <= 0
                  ):
                      raise ValueError("read_max_bytes must be a positive integer")
                  if not isinstance(self.search_budgets, WorkspaceSearchBudgets):
                      raise TypeError("search_budgets must be WorkspaceSearchBudgets")
                  self._resolver = WorkspaceResolver(self.root)
                  self.root = self._resolver.root

              def _path(self, raw: str) -> Path:
                  return self._resolver.resolve(raw)

              def read_file(self, args: dict[str, Any]) -> dict[str, Any]:
                  result = self._resolver.read_bounded(
                      str(args.get("input", "")),
                      max_bytes=self.read_max_bytes,
                  )
                  return result.to_dict()

              def search(self, args: dict[str, Any]) -> dict[str, Any]:
                  needle = str(args.get("input", ""))
                  result = self._resolver.search_text(
                      needle,
                      budgets=self.search_budgets,
                  )
                  return result.to_dict()

              def catalog(self) -> ToolRegistry:
                  input_schema = {
                      "type": "object",
                      "properties": {"input": {"type": "string", "minLength": 1}},
                      "required": ["input"],
                      "additionalProperties": False,
                  }
                  return ToolRegistry(
                      (
                          ToolSpec(
                              "read_file",
                              "Read one UTF-8 file inside the workspace with a byte limit and structured status.",
                              input_schema,
                              self.read_file,
                              risk="read",
                              side_effect=False,
                              timeout_seconds=30.0,
                              max_output_bytes=100_000,
                              recovery_policy=RecoveryPolicy.PURE,
                          ),
                          ToolSpec(
                              "search",
                              "Search UTF-8 workspace files with file, byte, time, and match budgets.",
                              input_schema,
                              self.search,
                              risk="read",
                              side_effect=False,
                              timeout_seconds=30.0,
                              max_output_bytes=100_000,
                              recovery_policy=RecoveryPolicy.PURE,
                          ),
                      )
                  )

              def registry(self) -> ToolRegistry:
                  return self.catalog()
          '''
          replacement = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in replacement.splitlines()
          ) + "\n"
          runtime.write_text(text[:start] + replacement, encoding="utf-8")

          package = Path("src/deepseek_runtime/__init__.py")
          text = package.read_text(encoding="utf-8")
          text = text.replace(
              "from .workspace import WorkspaceResolver, WorkspaceViolation",
              "from .workspace import (\n"
              "    WorkspacePathMissing,\n"
              "    WorkspaceReadResult,\n"
              "    WorkspaceResolver,\n"
              "    WorkspaceSearchBudgets,\n"
              "    WorkspaceSearchResult,\n"
              "    WorkspaceViolation,\n"
              ")",
              1,
          )
          anchor = '    "WorkspaceResolver",\n'
          exports = (
              '    "WorkspacePathMissing",\n'
              '    "WorkspaceReadResult",\n'
              '    "WorkspaceResolver",\n'
              '    "WorkspaceSearchBudgets",\n'
              '    "WorkspaceSearchResult",\n'
          )
          if anchor in text:
              text = text.replace(anchor, exports, 1)
          elif '    "WorkspaceSearchResult",\n' not in text:
              raise SystemExit("Workspace export anchor not found")
          package.write_text(text, encoding="utf-8")

      - name: Commit production integration
        shell: bash
        run: |
          if git diff --quiet -- src/deepseek_runtime/runtime.py src/deepseek_runtime/__init__.py; then
            echo "No patch required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/deepseek_runtime/runtime.py src/deepseek_runtime/__init__.py
          git commit -m "feat(workspace): attach bounded results to production tools"
          git push origin HEAD:agent/m2-e-workspace-p1

  lifecycle:
    name: ${{ matrix.os }} / Python 3.11
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run M2-D focused gate
        run: >-
          python scripts/m2_lifecycle_gate.py
          --output "m2-runtime-lifecycle-${{ runner.os }}.json"

      - name: Upload M2-D evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2-runtime-lifecycle-${{ runner.os }}
          path: m2-runtime-lifecycle-${{ runner.os }}.json
          if-no-files-found: error
          retention-days: 30
