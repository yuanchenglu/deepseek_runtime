name: M2 Runtime Lifecycle Gate

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m2-runtime-lifecycle-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  lifecycle:
    name: ${{ matrix.os }} / Python 3.11
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run M2-D focused gate
        run: >-
          python scripts/m2_lifecycle_gate.py
          --output "m2-runtime-lifecycle-${{ runner.os }}.json"

      - name: Upload M2-D evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2-runtime-lifecycle-${{ runner.os }}
          path: m2-runtime-lifecycle-${{ runner.os }}.json
          if-no-files-found: error
          retention-days: 30
