name: M2 Runtime Lifecycle Gate

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: m2-runtime-lifecycle-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  workspace-tests-patch:
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m2-e-workspace-p1
          fetch-depth: 0
      - name: Add M2-E regression matrix
        shell: python
        run: |
          import base64
          import zlib
          from pathlib import Path

          payload = zlib.decompress(base64.b64decode("")).decode("utf-8")
          path = Path("tests/test_workspace_p1.py")
          path.write_text(payload, encoding="utf-8")
      - name: Commit M2-E tests
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_workspace_p1.py
          git commit -m "test(workspace): cover byte-safe reads and search budgets"
          git push origin HEAD:agent/m2-e-workspace-p1

  lifecycle:
    name: ${{ matrix.os }} / Python 3.11
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Run M2-D focused gate
        run: >-
          python scripts/m2_lifecycle_gate.py
          --output "m2-runtime-lifecycle-${{ runner.os }}.json"
      - name: Upload M2-D evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2-runtime-lifecycle-${{ runner.os }}
          path: m2-runtime-lifecycle-${{ runner.os }}.json
          if-no-files-found: error
          retention-days: 30
