name: M2 Runtime Lifecycle Gate

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: m2-runtime-lifecycle-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  workspace-time-budget-fix:
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m2-e-workspace-p1
          fetch-depth: 0
      - name: Enforce time budget after a bounded file read
        shell: python
        run: |
          from pathlib import Path

          workspace = Path("src/deepseek_runtime/workspace.py")
          text = workspace.read_text(encoding="utf-8")
          old = '''                        bytes_scanned += result.bytes_read

                        if result.status in skipped:
          '''
          new = '''                        bytes_scanned += result.bytes_read
                        if elapsed() >= active.max_seconds:
                            stop_reason = "time-limit"
                            break

                        if result.status in skipped:
          '''
          if old in text:
              workspace.write_text(text.replace(old, new, 1), encoding="utf-8")
          elif new not in text:
              raise SystemExit("post-read time-budget anchor not found")

          tests = Path("tests/test_workspace_p1.py")
          text = tests.read_text(encoding="utf-8")
          anchor = '''    def test_search_reports_binary_without_exposing_content(self) -> None:
          '''
          addition = '''    def test_search_reports_time_limit_when_last_read_crosses_budget(self) -> None:
              class Clock:
                  def __init__(self) -> None:
                      self.values = iter((0.0, 0.01, 0.02, 0.2, 0.3))

                  def __call__(self) -> float:
                      return next(self.values, 0.3)

              with tempfile.TemporaryDirectory() as directory:
                  root = Path(directory)
                  (root / "one.txt").write_text("needle", encoding="utf-8")
                  result = WorkspaceResolver(root).search_text(
                      "needle",
                      budgets=WorkspaceSearchBudgets(
                          max_files=10,
                          max_bytes=1_000,
                          max_seconds=0.1,
                          max_matches=100,
                          max_file_bytes=1_000,
                      ),
                      clock=Clock(),
                  )

                  self.assertEqual(result.status, "budget-exhausted")
                  self.assertEqual(result.stop_reason, "time-limit")
                  self.assertEqual(result.files_scanned, 1)
                  self.assertGreaterEqual(result.bytes_scanned, 1)

          '''
          if addition not in text:
              if anchor not in text:
                  raise SystemExit("time-budget test anchor not found")
              tests.write_text(text.replace(anchor, addition + anchor, 1), encoding="utf-8")
      - name: Commit time-budget correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/deepseek_runtime/workspace.py tests/test_workspace_p1.py
          git commit -m "fix(workspace): enforce post-read time budget"
          git push origin HEAD:agent/m2-e-workspace-p1

  lifecycle:
    name: ${{ matrix.os }} / Python 3.11
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Run M2-D focused gate
        run: >-
          python scripts/m2_lifecycle_gate.py
          --output "m2-runtime-lifecycle-${{ runner.os }}.json"
      - name: Upload M2-D evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2-runtime-lifecycle-${{ runner.os }}
          path: m2-runtime-lifecycle-${{ runner.os }}.json
          if-no-files-found: error
          retention-days: 30
