name: Workspace Source Snapshot

on:
  push:
    branches: [agent/m1-workspace-p0]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: workspace-source-snapshot
          path: |
            src/deepseek_runtime/security.py
            src/deepseek_runtime/runtime.py
            src/deepseek_runtime/__init__.py
            tests
          if-no-files-found: error
          retention-days: 1
