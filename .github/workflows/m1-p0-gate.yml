name: M1 P0 Gate

on:
  pull_request:
    branches: [develop, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m1-p0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p0:
    name: ${{ matrix.os }} / Python 3.11
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run M1 P0 manifest 20 times
        shell: bash
        run: |
          python scripts/m1_p0_gate.py \
            --repetitions 20 \
            --output "m1-p0-${{ runner.os }}.json"

      - name: Upload P0 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-p0-${{ runner.os }}
          path: m1-p0-${{ runner.os }}.json
          if-no-files-found: error
          retention-days: 30
