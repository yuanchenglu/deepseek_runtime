[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deepseek-runtime"
version = "0.1.1a1"
description = "Fork-ready DeepSeek-native Python runtime kernel for local Agents"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
readme = "README.md"
authors = [{name = "7colorai"}]
dependencies = [
    "jsonschema>=4.23,<5",
    "cryptography>=42.0,<46",
]

[project.scripts]
deepseek-runtime = "deepseek_runtime.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
source = ["deepseek_runtime"]
branch = true
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 0
